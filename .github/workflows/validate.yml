name: Validate skill

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run offline tests
        run: python -m pytest -q
      - name: Validate skill and references
        run: python scripts/package_skill.py --check
      - name: Build skill archive
        run: python scripts/package_skill.py
      - uses: actions/upload-artifact@v4
        with:
          name: redbook-live-notes-${{ matrix.os }}
          path: dist/redbook-live-notes.zip
